# =====================================================================
# TEST environment - activated with -PTEST (the default profile)
# =====================================================================

# --- application under test ------------------------------------------
project.id=SP0308
url=https://bookcart.azurewebsites.net/login

# --- run defaults -----------------------------------------------------
# These are the lowest priority values: a <parameter> of the TestNG xml
# wins over them, and -Dbrowser / -Dheadless on the command line wins
# over everything.
browser=chrome
headless=false
timeout=30
default.user=User1

# --- browser ----------------------------------------------------------
# browser accepts: chrome | edge | chromium | firefox | webkit
#   chrome   -> Google Chrome installed on the machine
#   edge     -> Microsoft Edge installed on the machine
#   chromium -> the Chromium build bundled with Playwright
# Set browser.channel to force another channel (chrome-beta, msedge-dev, ...);
# browser.executable.path wins over it and launches that binary directly.
browser.channel=
browser.executable.path=
viewport.width=1920
viewport.height=1080
ignore.https.errors=true
slowmo=0

# --- evidence ---------------------------------------------------------
screenshot.on.failure=true
screenshots.clean.before.testcase=true
tracing.enabled=false
