# =====================================================================
# LOCAL environment - activated with -PLOCAL
#
# Points at the small demo application bundled in
# src/test/resources/demo-app. It needs no network access, which makes
# the Demo suite the quickest way to check that the framework, the
# screenshots, the downloads and the report all work on a new machine.
# =====================================================================

# --- application under test ------------------------------------------
project.id=SP0308
url=${projectDirUri}src/test/resources/demo-app/login.html

# --- run defaults -----------------------------------------------------
# the bundled Chromium, so the demo runs on a machine with no Chrome installed
browser=chromium
headless=true
timeout=20
default.user=User1

# --- browser ----------------------------------------------------------
# browser accepts: chrome | edge | chromium | firefox | webkit
#   chrome   -> Google Chrome installed on the machine
#   edge     -> Microsoft Edge installed on the machine
#   chromium -> the Chromium build bundled with Playwright
# Set browser.channel to force another channel (chrome-beta, msedge-dev, ...);
# browser.executable.path wins over it and launches that binary directly.
browser.channel=
browser.executable.path=
viewport.width=1440
viewport.height=900
ignore.https.errors=true
slowmo=0

# --- evidence ---------------------------------------------------------
screenshot.on.failure=true
screenshots.clean.before.testcase=true
tracing.enabled=false
