# =====================================================================
# UAT environment - activated with -PUAT
# =====================================================================

# --- application under test ------------------------------------------
project.id=SP0308
# Replace with the real UAT entry point of your application.
url=https://bookcart.azurewebsites.net/login

# --- run defaults -----------------------------------------------------
browser=chrome
headless=true
timeout=45
default.user=User2

# --- browser ----------------------------------------------------------
browser.channel=
browser.executable.path=
viewport.width=1920
viewport.height=1080
ignore.https.errors=true
slowmo=0

# --- evidence ---------------------------------------------------------
screenshot.on.failure=true
screenshots.clean.before.testcase=true
tracing.enabled=true
