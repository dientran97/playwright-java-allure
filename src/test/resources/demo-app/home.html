<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Demo Shop - Home</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1c2733; }
        header { background: #1e3a8a; color: #fff; padding: 14px 28px; display: flex;
                 justify-content: space-between; align-items: center; }
        main { max-width: 720px; margin: 28px auto; background: #fff; padding: 26px 30px;
               border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
        h2 { font-size: 18px; margin-top: 0; }
        .row { margin: 16px 0; }
        a, button { font-size: 14px; }
        button { padding: 8px 14px; border: 0; border-radius: 6px; background: #2563eb;
                 color: #fff; cursor: pointer; }
        #logout { background: #e2e8f0; color: #1c2733; }
        select { padding: 7px 9px; border: 1px solid #cbd5e0; border-radius: 6px; }
    </style>
</head>
<body>
<header>
    <span id="welcome">Welcome, Demo User</span>
    <button id="logout" type="button">Logout</button>
</header>
<main>
    <h2 id="pageTitle">My account</h2>
    <div class="row">
        <a id="downloadReport" href="#">Download the sales report</a>
    </div>
    <div class="row">
        <a id="openDocs" href="docs.html" target="_blank">Open the documentation in a new tab</a>
    </div>
    <div class="row">
        <label><input id="newsletter" type="checkbox"/> Subscribe to the newsletter</label>
    </div>
    <div class="row">
        <label for="country">Country</label>
        <select id="country">
            <option value="vn">Viet Nam</option>
            <option value="sg">Singapore</option>
            <option value="fr">France</option>
        </select>
    </div>
    <div class="row" id="selectedCountry">Selected country: vn</div>
</main>
<script>
    var params = new URLSearchParams(window.location.search);
    if (params.get('user')) {
        document.getElementById('welcome').textContent = 'Welcome, Demo User';
    }
    document.getElementById('logout').addEventListener('click', function () {
        window.location.href = 'login.html';
    });
    document.getElementById('country').addEventListener('change', function (event) {
        document.getElementById('selectedCountry').textContent = 'Selected country: ' + event.target.value;
    });
    document.getElementById('downloadReport').addEventListener('click', function (event) {
        event.preventDefault();
        var csv = 'order,customer,amount\n1001,Demo User,120.50\n1002,Review User,89.90\n';
        var blob = new Blob([csv], {type: 'text/csv'});
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'sales-report.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
</script>
</body>
</html>
